---
functional:
  - Пользователь должен иметь возможность зарегистрироваться, войти с помощью почты, через GitHub или Discord
  - Пользователь должен иметь возможность редактировать данные своего профиля
  - Пользователь должен иметь возможность просматривать информацию о себе и свою игровую статистику
  - Пользователь должен иметь возможность переключать язык интерфейса сайта
  - Авторизованный пользователь должен иметь возможность создать новую битву
  - Игрок должен иметь возможность выбрать уровень сложности задачи при создании битвы (elementary, easy, medium, hard)
  - Игрок должен иметь возможность выбрать тип соперника при создании битвы (бот, любой игрок или друг)
  - Игрок должен иметь возможность установить лимит времени на проведение битвы
  - Пользователь должен иметь возможность выбрать конкретную задачу из списка или задать выбор случайной задачи
  - Игрок должен иметь возможность пригласить друга в созданную приватную битву, передав ему ссылку на страницу этой битвы
  - Игрок должен иметь возможность присоединиться к существующей открытой битве из общего списка
  - Пользователь должен иметь возможность подключиться к уже идущей чужой битве в качестве зрителя (спектатора)
  - Игрок должен иметь возможность выбрать или сменить язык программирования непосредственно внутри созданной битвы
  - Сайт должен отображать актуальную версию компилятора или интерпретатора для выбранного языка программирования
  - Игрок должен иметь возможность писать решение в редакторе с подсветкой синтаксиса
  - Сайт должен показывать обоим участникам процесс написания кода друг друга в реальном времени
  - Сайт должен блокировать копирование текста из окна редактора кода соперника
  - Игрок должен иметь возможность запускать проверку своего кода (кнопка Check) неограниченное количество раз в течение битвы
  - Сайт должен запускать тесты исключительно для кода текущего игрока, не затрагивая код соперника
  - Игрок должен иметь возможность сдаться и досрочно завершить битву с помощью специальной кнопки в интерфейсе
  - Сайт должен автоматически фиксировать победу игрока, который первым успешно прошел все тесты
  - После победы сайт должен вывести модальное окно с поздравлением, заблокировать кнопку проверки кода и отобразить кнопку выхода из битвы
  - Сайт должен позволять проигравшему игроку продолжать редактировать и проверять свой код даже после определения победителя
  - Сайт должен пересчитывать рейтинг игроков по итогам битвы и отображать общую таблицу лидеров
  - Пользователь должен иметь возможность просматривать историю завершенных битв и код соперников
  - Авторизованный пользователь должен иметь возможность общаться как в общем чате в лобби, так и в отдельном чате внутри каждой битвы
  - Сайт должен разделять условие задачи и вывод результатов проверки тестов по разным вкладкам, а также выводить мгновенные уведомления о результатах проверки
  - Сайт должен автоматически прокручивать окно чата вниз при появлении новых сообщений и отображать имя автора
non-functional:
  - Сайт должен быть разработан с учетом удобства использования и оптимизирован для скорости работы
  - Сайт должен быть безопасным и защищать данные пользователя
  - Сайт должен быть удобным на мобильном устройстве
  - Сайт должен быть протестирован на совместимость с последними версиями браузеров
  - Сайт должен быть способен обрабатывать большое количество трафика (например, 1000 одновременных пользователей)
  - Сайт должен передавать изменения в коде соперника без заметных задержек
  - Сайт должен запускать пользовательский код в изолированной среде (Docker-контейнерах) на любом из поддерживаемых языков программирования
  - Сайт должен поддерживать переподключение игрока к активной битве при кратковременном разрыве соединения без потери прогресса
  - Сайт должен корректно переключать статусы битвы (активна, завершена, закрыта) и удалять сессию из памяти только после выхода обоих участников
implicit:
  - При вводе неверных учетных данных (никнейма, почты или пароля) пользователь должен получать понятное сообщение об ошибке
  - Сайт должен сохранять работоспособность основного режима битв при добавлении новых функций от сообщества
  - Сайт должен корректно завершать битву, если соперник вышел из игры, потерял связь или не перешел по ссылке-приглашению
  - Сайт должен обеспечивать одинаковый обратный отсчет времени битвы для обоих игроков
  - Сайт должен обеспечивать адекватную скорость решения задач ботом в соответствии с выбранной сложностью
  - Сайт должен выводить читаемые логи ошибок при сбоях компиляции или провале тестов
  - Редактор кода и текстовые поля не должны зависать или вызывать сбои интерфейса при вставке больших объемов текста, спецсимволов или эмодзи
  - Все типовые кнопки, шрифты и цветовые индикаторы статусов (например, зеленый для пройденных тестов и активных битв, красный для ошибок и поражений) должны быть оформлены в едином стиле на всех страницах сайта

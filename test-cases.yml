- summary: |
    Успешный выбор и установка лимита времени при создании новой битвы
  requirement: |
    Игрок должен иметь возможность установить лимит времени на проведение битвы
  prerequisites: |
    Пользователь авторизован на сайте, открыта главная страница, открыта панель разработчика DevTools (вкладка Network)
  test-data: |
    Выбранный лимит = 5 минут
  steps:
    - Нажимаем кнопку «Create battle» на главной странице для открытия параметров
    - В окне настройки битвы находим переключатель лимита времени
    - Поочередно выбираем несколько доступных значений времени и останавливаемся на Выбранном лимите
    - Выбираем тип соперника «Bot» и запускаем битву
    - Проверяем переданный параметр времени в запросе создания игры (или WebSocket-фрейме) во вкладке Network и отображение таймера на арене
  expected-result: |
    Все доступные варианты лимита времени корректно выбираются в форме. 
    После старта битвы на арене запускается обратный отсчет таймера с установленных 5 минут (4:59...), а в DevTools (Network) передается выбранный параметр времени (timeout_seconds: 900)

- summary: |
    Автоматическое завершение битвы по истечении установленного лимита времени (таймаут)
  requirement: |
    Игрок должен иметь возможность установить лимит времени на проведение битвы
  prerequisites: |
    Пользователь авторизован на сайте, открыта главная страница, открыта панель разработчика DevTools (вкладка Network)
  test-data: |
    Лимит времени = 1 минута
  steps:
    - Нажимаем кнопку «Create battle» на главной странице для открытия параметров
    - Создаем битву с минимально доступным Лимитом времени
    - На арене битвы не отправляем верное решение и дожидаемся, пока таймер обратного отсчета дойдет до 00:00
    - Проверяем WebSocket-сообщение о завершении игры по таймауту во вкладке Network (WS)
  expected-result: |
    По достижении 00:00 таймер останавливается, битва автоматически завершается (фиксируется ничья или поражение по истечении времени), кнопка «Check» блокируется. 
    В DevTools (Network -> WS) от сервера приходит событие о завершении игры по таймауту

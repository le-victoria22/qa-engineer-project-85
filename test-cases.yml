- summary: |
    Успешная регистрация нового пользователя с использованием электронной почты
  requirement: |
    Пользователь должен иметь возможность зарегистрироваться, войти с помощью почты, через GitHub или Discord
  prerequisites:
    Открыта страница регистрации на сайте, пользователь не авторизован, открыта панель разработчика DevTools (вкладка Network)
  test-data: |
    Nickname = elena_qa
    Email = валидный незарегистрированный email - qa_for_test_case@proton.me
    Password = 78-j=NYg.gn4f3z
  steps:
    - Заполняем поля имени пользователя, электронной почты, пароля и подтверждения пароля данными
    - Нажимаем кнопку "Sign Up"
    - Проверяем отправленный POST-запрос во вкладке Network
  expected-result: |
    Аккаунт успешно создается, пользователь авторизуется в системе и перенаправляется на главную страницу. 
    В DevTools (Network) POST-запрос регистрации содержит в Payload переданные данные и возвращает успешный статус ответа (200 OK, 201 Created или 302 Found) без ошибок сервера

- summary: |
    Успешный вход в систему с валидными электронной почтой и паролем
  requirement: |
    Пользователь должен иметь возможность зарегистрироваться, войти с помощью почты, через GitHub или Discord
  prerequisites: |
    - Открыта главная страница сайта, пользователь не авторизован, аккаунт заранее зарегистрирован
    - Открыта панель разработчика DevTools (вкладка Network)
  test-data: |
    Email = валидный зарегистрированный email - qa_for_test_case@proton.me
    Password = верный пароль от аккаунта - 78-j=NYg.gn4f3z
  steps:
    - Нажимаем кнопку «Sign in» в шапке сайта
    - Вводим зарегистрированный email и верный пароль в соответствующие поля
    - Нажимаем кнопку «Sign in»
    - Проверяем запрос авторизации во вкладке Network
  expected-result: |
    Пользователь успешно входит в аккаунт и попадает на главную страницу сайта. 
    В DevTools (Network) POST-запрос на создание сессии (например, /session или /api/v1/session) возвращает успешный статус ответа (200 OK или 302 Found)

- summary: |
    Попытка регистрации с некорректным форматом электронной почты
  requirement: |
    При вводе неверных учетных данных (никнейма, почты или пароля) пользователь должен получать понятное сообщение об ошибке
  prerequisites: |
    Открыта страница регистрации на сайте, пользователь не авторизован, открыта панель разработчика DevTools (вкладка Network)
  test-data: |
    Nickname = alex891
    Email = invalid-email-format.ru
    Password = ValidPass123!
  steps:
    - Вводим некорректный адрес электронной почты без символа @
    - Заполняем остальные поля валидными данными и нажимаем кнопку регистрации
    - Проверяем наличие или отсутствие исходящего запроса во вкладке Network
  expected-result: |
    Регистрация блокируется, выводится сообщение о некорректном формате email. 
    В DevTools (Network) запрос либо не отправляется вовсе, либо сервер возвращает статус 422 Unprocessable Entity с описанием ошибки поля email

- summary: |
    Попытка входа через почту с неверным паролем
  requirement: |
    При вводе неверных учетных данных (никнейма, почты или пароля) пользователь должен получать понятное сообщение об ошибке
  prerequisites: |
    - Открыта главная страница сайта, пользователь не авторизован
    - Открыта панель разработчика DevTools (вкладка Network)
  test-data: |
    Email = валидный зарегистрированный email - qa_for_test_case@proton.me
    Password = WrongPassword999
  steps:
    - Нажимаем кнопку «Sign in» в шапке сайта
    - Вводим зарегистрированный email и заведомо неверный пароль в соответствующие поля
    - Нажимаем кнопку «Sign in»
    - Проверяем ответ сервера во вкладке Network

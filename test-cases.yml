    - Проверяем цветовое выделение синтаксических элементов, автозакрытие скобок/кавычек и обновление нумерации строк при переносе строки
    - Выделяем Фрагмент кода и выполняем копирование, вставку и удаление текста
  expected-result: |
    Редактор корректно принимает ввод с клавиатуры и вставку из буфера обмена.
    Ключевые слова, строки, числа и комментарии подсвечиваются разными цветами в соответствии с выбранным языком, нумерация строк обновляется корректно


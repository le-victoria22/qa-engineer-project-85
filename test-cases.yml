- summary: |
    Успешный выбор и переключение типов соперников в форме создания битвы с запуском битвы против бота
  requirement: |
    Игрок должен иметь возможность выбрать тип соперника при создании битвы (бот, любой игрок или друг)
  prerequisites: |
    Пользователь авторизован на сайте, открыта главная страница, открыта панель разработчика DevTools (вкладка Network)
  test-data: | " "
  steps:

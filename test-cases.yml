    Вход в систему не выполняется, пользователь остается на странице авторизации, отображается понятное сообщение об ошибке. 
    В DevTools (Network) сервер возвращает клиентскую ошибку (статус 401 Unauthorized, 422 Unprocessable Entity или 200 OK с текстом ошибки валидации в теле ответа, но без статуса 500)


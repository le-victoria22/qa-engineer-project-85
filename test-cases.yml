- summary: |
    Успешное указание и очистка названия клана в настройках профиля
  requirement: |
    Пользователь должен иметь возможность редактировать данные своего профиля
  prerequisites: |
    Пользователь авторизован на сайте и находится на странице настроек профиля, открыта панель разработчика DevTools (вкладка Network)
  test-data: |
    Клан = HexletQAtest
  steps:
    - Вводим произвольное название Клана в соответствующее текстовое поле
    - Нажимаем кнопку «Обновить профиль» и обновляем страницу
    - Очищаем поле клана (оставляем пустым) и снова нажимаем кнопку «Обновить профиль»
    - Проверяем отправленные запросы во вкладке Network
  expected-result: |
    Название клана успешно сохраняется и отображается после перезагрузки страницы; пустое поле клана также сохраняется без ошибок. 
    В DevTools (Network) запросы обновления профиля (PATCH/PUT или POST на эндпоинт настроек, например /api/v1/settings) возвращают успешный статус 200 OK

- summary: |
    Успешная смена основного языка программирования в настройках профиля
  requirement: |
    Пользователь должен иметь возможность редактировать данные своего профиля
  prerequisites: |
    Пользователь авторизован на сайте и находится на странице настроек профиля, открыта панель разработчика DevTools (вкладка Network)
  test-data: | " "
  steps:
    - В разделе "Настройки программирования" отмечаем галочкой любой язык программирования, отличный от выбранного на данный момент
    - Проверяем автоматический запрос во вкладке Network сразу после выбора значения
    - Обновляем страницу (F5) и переходим к созданию новой битвы для проверки выбранного языка
  expected-result: |
    Новый выбранный язык сохраняется автоматически сразу после выбора, отображается отмеченным в настройках после перезагрузки страницы и подставляется по умолчанию при создании новой битвы. 
    В DevTools (Network) запрос обновления настроек автоматически отправляется при смене значения и возвращает успешный статус 200 OK

- summary: |
    Просмотр общей информации о себе и сводной игровой статистики на странице профиля
  requirement: |
    Пользователь должен иметь возможность просматривать информацию о себе и свою игровую статистику
  prerequisites: |
    Пользователь авторизован на сайте, открыта панель разработчика DevTools (вкладка Network)
  test-data: | " "
  steps:
    - Нажимаем на свой никнейм или аватар и переходим на страницу профиля
    - Изучаем блок личной информации (никнейм, аватар, клан, дата регистрации)
    - Изучаем блок игровой статистики (текущий рейтинг, количество сыгранных битв, побед, поражений и сдач)
    - Проверяем сетевые запросы загрузки данных профиля во вкладке Network
  expected-result: |
    Страница профиля корректно загружается, отображаются актуальные личные данные пользователя и сводная статистика битв без пустых заглушек и ошибок верстки. 
    В DevTools (Network) GET-запрос на получение данных пользователя и статистики (например, /api/v1/users/...) возвращает статус 200 OK с валидным JSON-ответом

- summary: |
    Успешное обновление счетчика сыгранных битв и рейтинга в статистике после завершения новой битвы
  requirement: |
    Пользователь должен иметь возможность просматривать информацию о себе и свою игровую статистику
  prerequisites: |
    Пользователь авторизован, предварительно зафиксировал свои текущие показатели (рейтинг и количество битв) в профиле
  test-data: | " "
  steps:
    - Проводим одну быструю битву до её завершения (победа, поражение или сдача)
    - После окончания битвы возвращаемся на страницу своего профиля
    - Сравниваем обновленные показатели статистики (общее число битв, счетчик побед/поражений и рейтинг) с исходными
  expected-result: |
    Статистика в профиле актуализируется: общее количество проведенных битв увеличивается на 1, изменяется соответствующий счетчик исхода (победы, поражения или сдачи) и пересчитывается рейтинг (если битва была рейтинговой)


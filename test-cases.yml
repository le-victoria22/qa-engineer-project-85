- summary: |
    Попытка регистрации с паролем короче 8 символов
  requirement: |
    При вводе неверных учетных данных (никнейма, почты или пароля) пользователь должен получать понятное сообщение об ошибке
  prerequisites: |
    Открыта страница регистрации на сайте, пользователь не авторизован, открыта панель разработчика DevTools (вкладка Network)
  test-data: |
    Nickname = alex_891
    Email = alexalex890@gmail.com
    Password = Pass934
  steps:
    - Заполняем Nickname и Email
    - Вводим в поле Password
    - Нажимаем кнопку "Sign Up" и проверяем вкладку Network
  expected-result: |
    Регистрация блокируется, выводится сообщение о том, что пароль должен содержать не менее 8 символов. 
    В DevTools (Network) запрос либо не отправляется, либо сервер возвращает статус 422 Unprocessable Entity

- summary: |
    Попытка регистрации с уже существующим в системе адресом электронной почты
  requirement: |
    При вводе неверных учетных данных (никнейма, почты или пароля) пользователь должен получать понятное сообщение об ошибке
  prerequisites: |
    - Открыта страница регистрации, пользователь не авторизован, в системе уже существует аккаунт с указанным email
    - Открыта панель разработчика DevTools (вкладка Network)
  test-data: |
    Nickname = elena_qa112
    Email = qa_for_test_case@proton.me
    Password = 78-j=NYg.g
  steps:
    - Вводим Nickname, Password и Email, который уже привязан к другому аккаунту
    - Нажимаем кнопку "Sign Up"
    - Проверяем ответ сервера во вкладке Network
  expected-result: |
    Регистрация не выполняется, система выводит сообщение о том, что данный email уже занят. 
    В DevTools (Network) POST-запрос возвращает клиентскую ошибку (статус 422 Unprocessable Entity или 200 OK с текстом ошибки валидации в теле ответа, но без статуса 500)

- summary: |
    Попытка регистрации с некорректным форматом или длиной имени пользователя
  requirement: |
    При вводе неверных учетных данных (никнейма, почты или пароля) пользователь должен получать понятное сообщение об ошибке
  prerequisites: |
    Открыта страница регистрации на сайте, пользователь не авторизован, открыта панель разработчика DevTools (вкладка Network)
  test-data: |
    Некорректный_Nickname_1 = ab (2 символа, при минимуме 3)
    Некорректный_Nickname_2 = пользователь_1 (кириллица)
    Email = valid_new_user2@gmail.com
    Пароль = ValidPass123!
  steps:
    - Вводим Некорректный_Nickname_1, заполняем остальные поля валидными данными и нажимаем кнопку "Sign Up"
    - Вводим Некорректный_Nickname_2 и снова нажимаем кнопку регистрации
    - Проверяем запросы во вкладке Network
  expected-result: |
    В обоих случаях регистрация блокируется, система выводит подсказку о правилах формата имени (3–16 латинских букв, цифр, дефисов и подчеркиваний). 
    В DevTools (Network) срабатывает клиентская валидация или сервер возвращает статус 422 Unprocessable Entity
